  </defs>
  <rect width="1920" height="1080" fill="url(#studioGlow2)"/>
  <!-- Subtle Rim Light Backdrop -->
  <circle cx="1120" cy="520" r="380" fill="none" stroke="rgba(255,153,0,0.08)" stroke-width="80"/>
