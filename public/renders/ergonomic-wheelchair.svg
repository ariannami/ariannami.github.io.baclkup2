    <circle cx="-55" cy="115" r="142" fill="none" stroke="#ff9900" stroke-width="2.5"/>
    <!-- Tri-Spoke Carbon Hub -->
    <path d="M-55,115 L-55,-25 M-55,115 L68,185 M-55,115 L-178,185" stroke="url(#titanium)" stroke-width="16" stroke-linecap="round"/>
    <circle cx="-55" cy="115" r="26" fill="#16181d" stroke="#ff9900" stroke-width="4"/>
    <!-- Front Caster Wheel -->
    <circle cx="165" cy="215" r="58" fill="rgba(20,22,26,0.7)" stroke="#686e7a" stroke-width="10"/>
    <circle cx="165" cy="215" r="16" fill="#ff9900"/>
