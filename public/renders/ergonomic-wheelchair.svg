      <stop offset="0%" stop-color="#1f242b" stop-opacity="1"/>
      <stop offset="50%" stop-color="#111317" stop-opacity="1"/>
      <stop offset="100%" stop-color="#070809" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c828d"/>
      <stop offset="50%" stop-color="#383c44"/>
      <stop offset="100%" stop-color="#181a1f"/>
